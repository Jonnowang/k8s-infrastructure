apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actual
      version: v1
  template:
    metadata:
      labels:
        app: actual
        version: v1
    spec:
      containers:
        - image: docker.io/actualbudget/actual-server:latest
          imagePullPolicy: IfNotPresent
          name: actual
          resources:
            requests:
              memory: "256Mi"
              cpu: 100m
            limits:
              memory: "512Mi"
              cpu: 500m
          ports:
            - containerPort: 5006
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1000Mi
